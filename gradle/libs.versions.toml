[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
junit = "6.1.3"
jetbrainsMarkdown = "0.7.16"
room = "3.0.3"
sqlite = "2.7.1"
